<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎵 AI Music Generator</h1>

        <p class="subtitle">
            Create a unique melody based on your selected mood.
        </p>

        <div class="card">

            <label for="mood">Choose a Mood</label>

            <select id="mood">
                <option value="happy">😊 Happy</option>
                <option value="calm">🌙 Calm</option>
                <option value="energetic">⚡ Energetic</option>
                <option value="sad">💙 Sad</option>
            </select>

            <label for="tempo">Choose Tempo</label>

            <select id="tempo">
                <option value="slow">🐢 Slow</option>
                <option value="medium" selected>🎧 Medium</option>
                <option value="fast">🚀 Fast</option>
            </select>

            <button id="generateBtn">🎼 Generate Music</button>

            <button id="playBtn" disabled>▶️ Play Melody</button>

            <button id="stopBtn" disabled>⏹️ Stop</button>

            <p id="status">Choose a mood and generate your melody.</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
